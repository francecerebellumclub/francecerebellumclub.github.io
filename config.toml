baseurl = "https://francecerebellumclub.github.io/"
canonifyurls = true
theme = "hugo-academic-group"
languageCode = "en-us"
title = "France Cerebellum Club"
copyright = "&copy; France Cerebellum Club, 2026"
math = false
buildFuture = true   # show upcoming meetings (dated in the future)

# No tags/categories pages are needed.
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # allow raw HTML inside Markdown content

[params]
  description = "Website of the France Cerebellum Club"
  author = "France Cerebellum Club"
  custom_css = ["fcc.css"]
  # Google Analytics: uncomment and set your measurement ID to enable it.
  # gtm_id = "G-XXXXXXXXXX"

  # Club name shown below the image slider on the home page (slider images: content/slider/).
  slogan = "France Cerebellum Club"

  # Navigation bar (top left): logo (static/img/logo.png) followed by the club name.
  [[params.navbar_hierarchy]]
    name = "France Cerebellum Club"
    link = "/"
    position = 1

  [params.logo]
    image = "img/logo.png"
    link = "/"

  # Home page: short mission synopsis.
  [params.mission]
    title = "Our Mission"
    text = "The *France Cerebellum Club* is a scientific organization whose goal is to promote interactions and collaboration between scientists sharing a common interest in the study of the cerebellum. This is mainly achieved through the organization of a yearly meeting - the *Cerebellum Day(s)*. "
    link = "/about/"
    link_text = "More about the club"

  # Home page: latest news (taken from content/post/, newest first).
  [params.posts]
    title = "Latest News"
    count = 3
    str_all = "All news"
    str_read_more = "Read more"

  # Home page: mailing list (below the news). The "text" allows Markdown.
  [params.mailing_list]
    title = "Mailing List"
    intro = "Stay informed about Club announcements, events and position postings by subscribing to our mailing list."
    text = """
- **[Subscribe](https://framalistes.org/sympa/subscribe/francecerebellumclub)** to the list
- **[Unsubscribe](https://framalistes.org/sympa/sigrequest/francecerebellumclub)** from the list
- **Write** to the list ➙ [francecerebellumclub@framalistes.org](mailto:francecerebellumclub@framalistes.org)
"""

# Navigation bar (the weight sets the order).
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Annual Meetings"
  url = "/meetings/"
  weight = 2

[[menu.main]]
  name = "Research Teams"
  url = "/teams/"
  weight = 3

[[menu.main]]
  name = "About the Club"
  url = "/about/"
  weight = 4
