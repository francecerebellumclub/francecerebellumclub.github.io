# Map positions of the cities used in content/teams/*.md (field `city`).
# A team whose city is missing here is still listed, but its city gets no pin on the map.
# Coordinates: latitude, longitude (e.g. from the city's Wikipedia page).
# label: where the city name sits next to its pin (right, left, top or bottom), to avoid overlaps.
[Paris]
  label = "top"
  lat = 48.8566
  lon = 2.3522

[Paris-Saclay]
